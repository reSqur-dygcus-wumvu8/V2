name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  swift-tests:
    name: Tests Swift (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Sélection de Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true
      - name: Tests PackageDomain
        working-directory: Packages/PackageDomain
        run: swift test
      - name: Tests PackageMLA
        working-directory: Packages/PackageMLA
        run: swift test
      - name: Tests PackageTor
        working-directory: Packages/PackageTor
        run: swift test
      - name: Tests PackagePersistence
        working-directory: Packages/PackagePersistence
        run: swift test
      - name: Tests PackageNetworking
        working-directory: Packages/PackageNetworking
        run: swift test
      - name: Tests PackageIntelligence
        working-directory: Packages/PackageIntelligence
        run: swift test
      - name: Tests FeatureAcquerir
        working-directory: Packages/Features/FeatureAcquerir
        run: swift test
      - name: Tests FeatureExploiter
        working-directory: Packages/Features/FeatureExploiter
        run: swift test
      - name: Tests FeatureGerer
        working-directory: Packages/Features/FeatureGerer
        run: swift test
      - name: Tests PackageAcces
        working-directory: Packages/PackageAcces
        run: swift test
      - name: Construction Collecteur (Mac hub)
        working-directory: App/OSINTSuite/Collecteur
        run: swift build
      - name: Tests FeatureCapitaliser
        working-directory: Packages/Features/FeatureCapitaliser
        run: swift test

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  swift-tests:
    name: Tests Swift (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Sélection de Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true
      - name: Tests PackageDomain
        working-directory: Packages/PackageDomain
        run: swift test
      - name: Tests PackagePersistence
        working-directory: Packages/PackagePersistence
        run: swift test
      - name: Tests PackageNetworking
        working-directory: Packages/PackageNetworking
        run: swift test
      - name: Tests PackageIntelligence
        working-directory: Packages/PackageIntelligence
        run: swift test
      - name: Tests FeatureAcquerir
        working-directory: Packages/Features/FeatureAcquerir
        run: swift test
      - name: Tests FeatureCapitaliser
        working-directory: Packages/Features/FeatureCapitaliser
        run: swift test
